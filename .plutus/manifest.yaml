# Plutus reproducibility manifest (plutus-verify 0.5.x).
# `plutus check .` builds the locked environment, runs every step in a container
# and compares the metrics each step writes (scripts/plutus_results.py) with the
# values below, and every number in the saved stage reports with the blessed copies
# in .plutus/expected/. `plutus snapshot .` re-blesses them after an intended change.
schema_version: "2.0"

repo:
  name: Calibrum VN30F
  primary_language: python

env:
  base: python
  python_version: "3.12"
  manager: uv
  lockfile: uv.lock
  os_packages: [git]   # uv fetches the pinned Plutus commit from GitHub

secrets: []

data_sources:
  processed: []
  raw: []

steps:
  - id: data_preparation
    nine_step: step_2_data_preparation
    required: true
    network: bridge
    timeout_seconds: 1800
    command: "python scripts/fetch_dnse_candles.py --start 2018-08-01 --end 2026-10-23 --resolution 1 && python scripts/fetch_dnse_candles.py --start 2018-08-01 --end 2026-10-23 --resolution 5 && python scripts/plutus_results.py data_preparation"
    outputs: ["data/dnse/*_1m.parquet", "data/dnse/*_5m.parquet"]
    sub_processes:
      collection: {description: "VN30F1M and VN30 1-minute and 5-minute bars from the public DNSE chart API, 1 Aug 2018 to 2026-10-23 (research stages stop at 21 Oct, the end of OOS 2; step 7 marks the paper account to 23 Oct)"}
      processing: {description: "front-month contract code, 5-minute bars fill sessions DNSE lacks at 1 minute, 10- and 30-minute aggregation in src/adapters/data/dnse_minute_bars.py (done when each stage loads the data)"}
  - id: optimization
    nine_step: step_5_optimization
    required: true
    timeout_seconds: 1800
    command: "python scripts/run_calibrum_1m.py momentum-cv && python scripts/run_calibrum_1m.py momentum-q && python scripts/run_calibrum_1m.py basis-grid && python scripts/plutus_results.py optimization"
    outputs: ["reports/calibrum_1m/momentum_model.json", "reports/calibrum_1m/momentum_threshold.json", "reports/calibrum_1m/basis_grid.json"]
    depends_on: [data_preparation]
  - id: in_sample
    nine_step: step_4_in_sample
    required: true
    timeout_seconds: 1800
    command: "python scripts/run_calibrum_1m.py in-sample-baseline && python scripts/plutus_results.py in_sample"
    outputs: ["reports/calibrum_1m/in_sample_baseline.json"]
    depends_on: [optimization]
  - id: out_of_sample
    nine_step: step_6_out_of_sample
    required: true
    timeout_seconds: 1800
    command: "python scripts/run_calibrum_1m.py valid && python scripts/run_calibrum_1m.py oos1 && python scripts/run_calibrum_1m.py oos2 && python scripts/plutus_results.py out_of_sample"
    outputs: ["reports/calibrum_1m/valid.json", "reports/calibrum_1m/oos1.json", "reports/calibrum_1m/oos2.json"]
    depends_on: [optimization]
  - id: paper_trading
    nine_step: step_7_paper_trading
    required: true
    timeout_seconds: 600
    command: "python scripts/paper_luna.py && python scripts/plutus_results.py paper_trading"
    outputs: ["reports/paper/luna.json"]
    depends_on: [data_preparation]

